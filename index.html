<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Euripedes Rocha">
    <title>Quadro de Tarefas</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
</head>

<body>

    <header>
        <h1>Quadro de Tarefas</h1>
    </header>
    
    <p id="status-regiao" class="feedback" role="status" aria-live="polite"></p>

    <main>


        <form>
            <fieldset>
                <legend>Filtros de busca:</legend>
                <label for="titulo">Título da tarefa:</label>
                <input id="titulo" type="search" placeholder="Título" autocomplete="off">

                <label for="prioridade">Prioridade da tarefa:</label>
                <select id="prioridade">
                    <option value="todas">Todas</option>
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                </select>

                <label for="status">Status da tarefa:</label>
                <select id="status">
                    <option value="todos">Todos</option>
                    <option value="a-fazer">A fazer</option>
                    <option value="em-andamento">Em andamento</option>
                    <option value="em-revisao">Em revisão</option>
                    <option value="concluida">Concluída</option>
                </select>

                <label for="ordenacao">Ordenar por prazo:</label>
                <select id="ordenacao">
                    <option value="prazo">Mais próximo primeiro</option>
                    <option value="prazo-desc">Mais distante primeiro</option>
                </select>

                <button type="button" id="limpar-filtros">Limpar filtros</button>
            </fieldset>
        </form>
        <section aria-labelledby="titulo-afazer">
            <h2 id="titulo-afazer"> Tarefas a fazer</h2>
            <ul data-lista-status="a-fazer"></ul>
        </section>

        <section aria-labelledby="titulo-emandamento">
            <h2 id="titulo-emandamento"> Tarefas em andamento</h2>
            <ul data-lista-status="em-andamento"></ul>
        </section>

        <section aria-labelledby="titulo-emrevisao">
            <h2 id="titulo-emrevisao"> Tarefas em revisão</h2>
            <ul data-lista-status="em-revisao"></ul>
        </section>

        <section aria-labelledby="titulo-concluida">
            <h2 id="titulo-concluida"> Tarefas concluida</h2>
            <ul data-lista-status="concluida"></ul>
        </section>

    </main>

</body>

<footer>
    <p>
        &star; Euripedes Rocha Neto - Desenvolvimento Front-End &star;
    </p>
</footer>

</html>
